[package]
# Must be unique in the dependency graph: the xlsx crate is itself published as
# `ironcalc`, so this binding crate uses a distinct package name.
name = "ironcalc-ruby"
version = "0.7.1"
edition = "2021"
publish = false

[lib]
# The compiled artifact is loaded by Ruby as `ironcalc/ironcalc_ruby`, so the
# library (and the `Init_ironcalc_ruby` entry point magnus generates) is named
# `ironcalc_ruby`.
name = "ironcalc_ruby"
crate-type = ["cdylib"]

[dependencies]
magnus = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_magnus = "0.11"
bitcode = "0.6.8"
xlsx = { package = "ironcalc", path = "../../../../xlsx", version = "0.7.1" }
